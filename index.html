<style>
:root{--b:#0e0e0f;--c:#17171a;--l:#2c2c30;--g:#C9B58A;--i:#F2ECDD;--m:#a39d90;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;margin:0}
body{background:var(--b);color:var(--i);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.9;font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--b);z-index:60}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g);outline-offset:3px}
.w{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(14,14,15,.94);border-bottom:1px solid var(--l)}
.hd{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:800;letter-spacing:.32em;font-size:19px;color:var(--g);direction:ltr}
nav{display:flex;gap:26px;font-size:14px}nav a{color:var(--m)}nav a:hover{color:var(--g)}
.ic{display:flex;gap:14px;align-items:center}
.btn{background:none;border:1px solid var(--g);color:var(--g);padding:6px 20px;cursor:pointer;transition:.2s;font-size:14px}
.btn:hover:not(:disabled){background:var(--g);color:var(--b)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.f{background:var(--g);color:var(--b)}.btn.f:hover:not(:disabled){background:var(--i);border-color:var(--i)}
.bar{background:var(--g);color:var(--b);text-align:center;font-size:13px;padding:4px}
.burger{display:none}
@media(max-width:720px){nav{display:none;position:absolute;top:64px;inset-inline:0;background:var(--b);flex-direction:column;padding:16px 20px;border-bottom:1px solid var(--l)}nav.on{display:flex}.burger{display:block}.hide-m{display:none}}
.hero{padding:96px 0 72px;border-bottom:1px solid var(--l)}
.hero h1{font-weight:300;font-size:clamp(30px,6vw,60px);line-height:1.4;max-width:16ch}
.hero p{color:var(--m);max-width:44ch;margin:16px 0 28px}
.tag{direction:ltr;text-align:right;color:var(--g);letter-spacing:.12em;font-size:12px;margin-top:28px}
h2.s{font-weight:300;font-size:26px;margin:56px 0 20px;display:flex;justify-content:space-between;align-items:baseline}
h2.s a{font-size:13px;color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px 16px}
.art{aspect-ratio:4/5;background:var(--c);border:1px solid var(--l);display:grid;place-items:center;overflow:hidden;color:var(--l);font-weight:800;font-size:40px;letter-spacing:.2em;direction:ltr;position:relative}
.art img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.card:hover img{transform:scale(1.04)}
.card h3{font-size:15px;font-weight:400;margin-top:10px}.pr{color:var(--g);font-size:14px}.old{color:var(--m);text-decoration:line-through;font-size:12px;margin-inline-start:6px}
.st{font-size:12px;color:var(--m)}.st.lo{color:#d6a35c}.st.no{color:#c46a6a}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{background:none;border:1px solid var(--l);color:var(--m);padding:2px 14px;cursor:pointer;font-size:13px}.chip.on{border-color:var(--g);color:var(--g)}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 8px}
input,select,textarea{background:var(--c);border:1px solid var(--l);padding:8px 12px;width:100%;border-radius:0}
input:focus,select:focus,textarea:focus{border-color:var(--g);outline:none}
.tools>*{width:auto;flex:1;min-width:140px}
label{display:block;font-size:13px;color:var(--m);margin:12px 0 4px}
.err{color:#d98a8a;font-size:12px;min-height:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}@media(max-width:760px){.two{grid-template-columns:1fr;gap:24px}}
.box{border:1px solid var(--l);background:var(--c);padding:20px}
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--l)}.line .nm{flex:1;font-size:14px}
.q{display:flex;gap:10px;align-items:center}.q button{width:28px;height:28px;background:none;border:1px solid var(--l);cursor:pointer}
.th{width:56px}.th .art{font-size:12px}
.tot{display:flex;justify-content:space-between;padding:6px 0}.tot.b{border-top:1px solid var(--g);margin-top:8px;padding-top:12px;color:var(--g);font-weight:600}
.tl{list-style:none;padding:0;border-inline-start:1px solid var(--g);margin:12px 8px}.tl li{padding:0 18px 14px;position:relative}.tl li::before{content:"";position:absolute;inset-inline-start:-4px;top:12px;width:7px;height:7px;background:var(--g);border-radius:50%}
.note{color:var(--m);font-size:13px}.card-no{font-size:22px;letter-spacing:.12em;direction:ltr;text-align:center;color:var(--g);padding:14px 0}
.warn{border:1px solid #6b5a3a;background:#1d1a14;padding:10px 14px;font-size:13px;color:#d9c9a0;margin:12px 0}
footer{border-top:1px solid var(--l);margin-top:80px;padding:36px 0;color:var(--m);font-size:13px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--g);color:var(--b);padding:8px 20px;z-index:70;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--l);text-align:start}
.ad{display:grid;grid-template-columns:180px 1fr;gap:28px;padding-top:24px}@media(max-width:760px){.ad{grid-template-columns:1fr}.ad aside{display:flex;gap:6px;flex-wrap:wrap}}
.ad aside button{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--l);color:var(--m);padding:8px 0;cursor:pointer}.ad aside button.on{color:var(--g)}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.kp div{border:1px solid var(--l);padding:12px}.kp b{display:block;font-size:22px;color:var(--g);font-weight:600}
.pol{white-space:pre-line;color:var(--m)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="bar" class="bar" hidden></div>
<header><div class="w hd">
  <a href="#/" class="logo" aria-label="VELZAR">VELZAR</a>
  <nav id="nav"><a href="#/">خانه</a><a href="#/shop">فروشگاه</a><a href="#/shop">دسته‌بندی‌ها</a><a href="#/about">درباره ما</a><a href="#/contact">تماس</a><a href="#/track">پیگیری سفارش</a></nav>
  <div class="ic"><a href="#/shop" class="btn hide-m">جستجو</a><a href="#/cart" class="btn" id="cb">سبد (۰)</a><button class="btn burger" data-a="nav" aria-label="منو">منو</button></div>
</div></header>
<main id="app" class="w"></main>
<footer><div class="w"><span class="logo" style="font-size:15px">VELZAR</span>
<p id="ft" style="margin-top:10px"></p><p style="margin-top:6px"><a href="#/policy/privacy">حریم خصوصی</a> · <a href="#/policy/terms">شرایط خرید</a> · <a href="#/policy/shipping">ارسال</a> · <a href="#/policy/returns">مرجوعی</a> · <a href="#/policy/payment">پرداخت</a> · <a href="#/admin">مدیریت</a></p></div></footer>
<script>
const $=s=>document.querySelector(s),fa=n=>(+n).toLocaleString('fa-IR'),T=n=>fa(n)+' تومان';
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const en=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const ST={awaiting_payment:'در انتظار پرداخت',awaiting_receipt_review:'در انتظار بررسی رسید',payment_confirmed:'پرداخت تأیید شد',processing:'در حال آماده‌سازی',shipped:'ارسال شد',delivered:'تحویل داده شد',cancelled:'لغو شد',payment_rejected:'پرداخت تأیید نشد'};
const PAID=['payment_confirmed','processing','shipped','delivered'];
function seed(){const P=(id,name,cat,price,stock,v,x={})=>({id,name,cat,price,disc:0,stock,sku:'DEMO-'+id,desc:'محصول نمونه آزمایشی؛ از پنل مدیریت ویرایش یا حذف کنید.',variants:v,pub:true,feat:id<4,isnew:id>5,img:'',...x});
return{products:[P(1,'انگشتر مینیمال','انگشتر',1850000,6,'سایز ۱۶,سایز ۱۷,سایز ۱۸'),P(2,'دستبند زنجیری','دستبند',1250000,10,'نقره‌ای,شامپاینی'),P(3,'گردنبند تک‌پلاک','گردنبند',1450000,3,'',{disc:10}),P(4,'گوشواره حلقه‌ای','گوشواره',980000,12,''),P(5,'بند ساعت چرمی','ساعت',750000,0,'مشکی,قهوه‌ای'),P(6,'دکمه سردست','آقایان',1100000,8,''),P(7,'جاکلیدی چرمی','لوازم',420000,20,''),P(8,'کیف کارت','لوازم',690000,15,'مشکی')],
orders:[],set:{name:'VELZAR',tag:"More Than Accessories — It's a Lifestyle.",card:'',holder:'',tg:'Admin_Velzar',ig:'Admin_Velzar',ei:'Admin_Velzar',promise:'پس از تأیید پرداخت، سفارش شما حداکثر طی ۲۴ ساعت برای ارسال آماده می‌شود.',ship:0,eta:'',ann:'',hero:'اکسسوری، فراتر از یک اکسسوری',heroSub:'طراحی مینیمال، جنس باکیفیت و جزئیاتی که به چشم می‌آید.',about:'VELZAR یک برند اکسسوری مینیمال و مدرن است. این متن را از پنل مدیریت ویرایش کنید.',contact:'برای پیگیری سفارش از پیام‌رسان‌های زیر پیام بدهید.',foot:'© VELZAR',
pol:{privacy:'اطلاعات شما فقط برای ثبت و ارسال سفارش استفاده می‌شود. (متن را ویرایش کنید)',terms:'ثبت سفارش به معنی پذیرش شرایط خرید است. (متن را ویرایش کنید)',shipping:'سفارش پس از تأیید پرداخت آماده‌سازی و سپس به شرکت حمل تحویل می‌شود. زمان رسیدن به دست شما به شرکت حمل بستگی دارد. (متن را ویرایش کنید)',returns:'شرایط مرجوعی و تعویض را اینجا بنویسید.',payment:'پرداخت کارت‌به‌کارت است و فقط پس از بررسی ادمین تأیید می‌شود. (متن را ویرایش کنید)'}}}}
let DB,CART={};
try{DB=JSON.parse(localStorage.getItem('vz'))}catch(_){}try{CART=JSON.parse(localStorage.getItem('vzc'))||{}}catch(_){}
DB=DB||seed();
const save=()=>{try{localStorage.setItem('vz',JSON.stringify(DB));localStorage.setItem('vzc',JSON.stringify(CART))}catch(_){toast('ذخیره‌سازی مرورگر فعال نیست')}};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
const eff=p=>Math.round(p.price*(100-(p.disc||0))/100),byId=id=>DB.products.find(p=>p.id==id);
const now=()=>new Date().toLocaleString('fa-IR');
const rnd=(n,al)=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>al[b%al.length]).join('');
function release(o){if(o.rel)return;o.rel=1;o.items.forEach(i=>{const p=byId(i.pid);if(p)p.stock+=i.qty})}
function setSt(o,s,by,note){o.status=s;o.hist.push({s,t:now(),by,note:note||''});if(s==='cancelled'||s==='payment_rejected')release(o)}
DB.orders.forEach(o=>{if(o.status==='awaiting_payment'&&Date.now()-o.ts>864e5){setSt(o,'cancelled','سیستم','انقضای ۲۴ ساعته');}});save();
const S={q:'',cat:'',max:'',sort:'new',n:8};
const stock=p=>p.stock<=0?'<span class="st no">ناموجود</span>':p.stock<=3?`<span class="st lo">فقط ${fa(p.stock)} عدد</span>`:'<span class="st">موجود</span>';
const art=p=>`<div class="art">${p.img?`<img src="${e(p.img)}" alt="${e(p.name)}" loading="lazy">`:'VZ'}</div>`;
const card=p=>`<article class="card"><a href="#/p/${p.id}">${art(p)}<h3>${e(p.name)}</h3></a><div class="row"><span class="pr">${T(eff(p))}${p.disc?`<span class="old">${T(p.price)}</span>`:''}</span>${stock(p)}</div>${p.stock>0&&!p.variants?`<button class="btn" style="margin-top:8px;width:100%" data-a="add" data-id="${p.id}">افزودن به سبد</button>`:`<a class="btn" style="display:block;text-align:center;margin-top:8px" href="#/p/${p.id}">مشاهده</a>`}</article>`;
const live=()=>DB.products.filter(p=>p.pub);
const cartLines=()=>Object.entries(CART).map(([k,q])=>{const[id,v]=k.split('|');const p=byId(id);return p&&p.pub?{k,p,v,q}:null}).filter(Boolean);
const ship=()=>+DB.set.ship||0;
function best(){const c={};DB.orders.filter(o=>PAID.includes(o.status)).forEach(o=>o.items.forEach(i=>c[i.pid]=(c[i.pid]||0)+i.qty));return live().filter(p=>c[p.id]).sort((a,b)=>c[b.id]-c[a.id]).slice(0,4)}
const P={};
P.home=()=>{const s=DB.set,f=live().filter(p=>p.feat).slice(0,4),n=live().filter(p=>p.isnew).slice(0,4),b=best(),cats=[...new Set(live().map(p=>p.cat).filter(Boolean))];
return`<section class="hero"><h1>${e(s.hero)}</h1><p>${e(s.heroSub)}</p><a class="btn f" href="#/shop">مشاهده محصولات</a><div class="tag">${e(s.tag)}</div></section>
${f.length?`<h2 class="s">محصولات منتخب</h2><div class="grid">${f.map(card).join('')}</div>`:''}
${n.length?`<h2 class="s">تازه‌ها</h2><div class="grid">${n.map(card).join('')}</div>`:''}
${b.length?`<h2 class="s">پرفروش‌ها</h2><div class="grid">${b.map(card).join('')}</div>`:''}
<h2 class="s">دسته‌بندی‌ها</h2><div class="chips">${cats.map(c=>`<a class="chip" href="#/shop/${encodeURIComponent(c)}">${e(c)}</a>`).join('')}</div>
<h2 class="s">درباره VELZAR</h2><p class="pol" style="max-width:60ch">${e(s.about)}</p>
<h2 class="s">ارسال و پشتیبانی</h2><div class="box"><p>${e(s.promise)}</p><p class="note">آماده‌سازی سفارش، تحویل به شرکت حمل و رسیدن بسته به دست شما سه مرحله جدا هستند.${s.eta?' '+e(s.eta):''}</p></div>`};
P.shop=c=>{if(c)S.cat=decodeURIComponent(c);const cats=[...new Set(live().map(p=>p.cat).filter(Boolean))];
return`<h2 class="s">فروشگاه</h2><div class="tools"><input data-f="q" type="search" placeholder="جستجوی نام محصول" aria-label="جستجو" value="${e(S.q)}"><input data-f="max" type="number" min="0" placeholder="سقف قیمت (تومان)" aria-label="سقف قیمت" value="${e(S.max)}"><select data-f="sort" aria-label="مرتب‌سازی"><option value="new">جدیدترین</option><option value="lo">ارزان‌ترین</option><option value="hi">گران‌ترین</option><option value="pop">محبوب‌ترین</option></select></div>
<div class="chips" id="cc"></div><div class="grid" id="g"></div><div style="text-align:center;margin-top:28px" id="more"></div>`};
function shopGrid(){if(!$('#g'))return;const cats=[...new Set(live().map(p=>p.cat).filter(Boolean))];
$('#cc').innerHTML=['',...cats].map(c=>`<button class="chip ${S.cat===c?'on':''}" data-a="cat" data-v="${e(c)}">${c?e(c):'همه'}</button>`).join('');
$('[data-f=sort]').value=S.sort;const pop={};DB.orders.filter(o=>PAID.includes(o.status)).forEach(o=>o.items.forEach(i=>pop[i.pid]=(pop[i.pid]||0)+i.qty));
let l=live().filter(p=>(!S.cat||p.cat===S.cat)&&p.name.includes(S.q.trim())&&(!S.max||eff(p)<=+S.max));
l.sort((a,b)=>S.sort==='lo'?eff(a)-eff(b):S.sort==='hi'?eff(b)-eff(a):S.sort==='pop'?(pop[b.id]||0)-(pop[a.id]||0):b.id-a.id);
$('#g').innerHTML=l.length?l.slice(0,S.n).map(card).join(''):'<p class="note">محصولی با این مشخصات پیدا نشد.</p>';
$('#more').innerHTML=l.length>S.n?'<button class="btn" data-a="more">نمایش بیشتر</button>':''}
P.p=id=>{const p=byId(id);if(!p||!p.pub)return'<p class="note" style="padding:60px 0">این محصول پیدا نشد. <a href="#/shop" style="color:var(--g)">بازگشت به فروشگاه</a></p>';
const v=p.variants?p.variants.split(',').map(x=>x.trim()).filter(Boolean):[],rel=live().filter(x=>x.cat===p.cat&&x.id!==p.id).slice(0,4);
return`<div class="two" style="padding-top:32px"><div>${art(p)}</div><div><h1 style="font-weight:300;font-size:28px">${e(p.name)}</h1><p class="pr" style="font-size:20px;margin:8px 0">${T(eff(p))}${p.disc?`<span class="old">${T(p.price)}</span>`:''}</p>${stock(p)}<p class="pol" style="margin:16px 0">${e(p.desc)}</p>
${v.length?`<label for="vr">گزینه</label><select id="vr">${v.map(x=>`<option>${e(x)}</option>`).join('')}</select>`:''}
<label for="qt">تعداد</label><input id="qt" type="number" min="1" max="${p.stock}" value="1" style="width:100px"><div style="margin-top:20px"><button class="btn f" data-a="add" data-id="${p.id}" data-pg="1" ${p.stock<=0?'disabled':''}>${p.stock<=0?'ناموجود':'افزودن به سبد'}</button></div>
<p class="note" style="margin-top:16px">${e(DB.set.promise)} مراحل آماده‌سازی، تحویل به حمل‌کننده و تحویل نهایی جدا هستند.</p></div></div>
${rel.length?`<h2 class="s">محصولات مرتبط</h2><div class="grid">${rel.map(card).join('')}</div>`:''}`};
P.cart=()=>{const L=cartLines();if(!L.length)return'<p class="note" style="padding:60px 0">سبد خرید خالی است. <a href="#/shop" style="color:var(--g)">مشاهده محصولات</a></p>';
const sub=L.reduce((s,l)=>s+eff(l.p)*l.q,0),bad=L.some(l=>l.q>l.p.stock);
return`<h2 class="s">سبد خرید</h2><div class="two"><div>${L.map(l=>`<div class="line"><div class="th">${art(l.p)}</div><div class="nm">${e(l.p.name)}${l.v?' · '+e(l.v):''}<br><span class="pr">${T(eff(l.p))}</span>${l.q>l.p.stock?`<br><span class="err">موجودی کافی نیست (${fa(l.p.stock)} عدد)</span>`:''}</div><div class="q"><button data-a="qty" data-k="${e(l.k)}" data-d="-1" aria-label="کم">−</button>${fa(l.q)}<button data-a="qty" data-k="${e(l.k)}" data-d="1" aria-label="زیاد">+</button></div><button class="chip" data-a="rm" data-k="${e(l.k)}">حذف</button></div>`).join('')}</div>
<div class="box"><div class="tot"><span>جمع محصولات</span><span>${T(sub)}</span></div><div class="tot"><span>هزینه ارسال</span><span>${ship()?T(ship()):'تعیین نشده'}</span></div><div class="tot b"><span>مبلغ نهایی</span><span>${T(sub+ship())}</span></div>

const o={code:rnd(12,'abcdefghjkmnpqrstuvwxyz23456789'),no:'VZ-'+y+'-'+rnd(4,'0123456789'),ts:Date.now(),status:'awaiting_payment',cust:{name:d.name.trim(),phone:ph,prov:d.prov.trim(),city:d.city.trim(),addr:d.addr.trim(),post:po,notes:d.notes.trim()},items:L.map(l=>({pid:l.p.id,name:l.p.name,v:l.v,qty:l.q,price:eff(l.p)})),sub,ship:ship(),total:sub+ship(),carrier:'',trk:'',adm:'',hist:[{s:'awaiting_payment',t:now(),by:'مشتری',note:'ثبت سفارش'}]};

if(k==='prod'){const id=+f.dataset.id,price=Math.round(+d.price),disc=Math.round(+d.disc||0),st=Math.round(+d.stock);

const p=id?byId(id):{id:Math.max(0,...DB.products.map(z=>z.id))+1,img:''};

const fl=d.img;if(fl&&fl.size){if(fl.size>4e6||!/^image\/(jpeg|png|webp)$/.test(fl.type)){er('p','فقط تصویر JPG/PNG/WebP تا ۴ مگابایت');return}
